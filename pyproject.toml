[project]
name = "fastvideocropper"
version = "0.8.0"
description = "Native Qt video cropping and trimming"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.13.7,<0.15",
    "psutil>=6",
    "platformdirs>=4",
    "qt-themes>=0.4.1,<0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.gui-scripts]
fastvideocropper = "fastvideocropper.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]

[tool.pytest.ini_options]
qt_api = "pyside6"
